<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Veeam Hardened Repository Bootstrap</title>
  <desc id="desc">Banner for the Veeam Hardened Repository Bootstrap project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10212b"/>
      <stop offset="55%" stop-color="#183a47"/>
      <stop offset="100%" stop-color="#264653"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4a261"/>
      <stop offset="100%" stop-color="#e76f51"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#08131a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1090" cy="110" r="170" fill="#2a9d8f" opacity="0.16"/>
  <circle cx="1040" cy="500" r="210" fill="#f4a261" opacity="0.08"/>
  <circle cx="140" cy="110" r="120" fill="#e9c46a" opacity="0.08"/>

  <g transform="translate(72 80)">
    <rect x="0" y="0" width="490" height="58" rx="29" fill="#ffffff" opacity="0.08"/>
    <text x="28" y="37" fill="#f1faee" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700">
      Veeam Hardened Repository Bootstrap
    </text>

    <text x="0" y="136" fill="#ffffff" font-size="66" font-family="Segoe UI, Arial, sans-serif" font-weight="800">
      Safer first attach.
    </text>
    <text x="0" y="212" fill="#ffffff" font-size="66" font-family="Segoe UI, Arial, sans-serif" font-weight="800">
      Smarter Linux hardening.
    </text>

    <rect x="0" y="258" width="500" height="6" rx="3" fill="url(#accent)"/>

    <text x="0" y="330" fill="#dbe7ec" font-size="30" font-family="Segoe UI, Arial, sans-serif">
      Ubuntu 22.04 / 24.04
    </text>
    <text x="0" y="372" fill="#dbe7ec" font-size="30" font-family="Segoe UI, Arial, sans-serif">
      LVM + XFS + SSH/UFW + post-attach lockdown
    </text>
    <text x="0" y="414" fill="#dbe7ec" font-size="30" font-family="Segoe UI, Arial, sans-serif">
      Built for Veeam onboarding safety and operator clarity
    </text>
  </g>

  <g transform="translate(742 112)" filter="url(#shadow)">
    <rect x="0" y="0" width="440" height="376" rx="28" fill="#f7fbfc"/>
    <rect x="0" y="0" width="440" height="76" rx="28" fill="#1f6f78"/>
    <circle cx="36" cy="38" r="8" fill="#f4a261"/>
    <circle cx="62" cy="38" r="8" fill="#e76f51"/>
    <circle cx="88" cy="38" r="8" fill="#2a9d8f"/>

    <g transform="translate(34 116)">
      <rect x="0" y="0" width="372" height="68" rx="20" fill="#edf6f4"/>
      <text x="22" y="43" fill="#10323d" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700">
        Phase 1  Prepare
      </text>
      <text x="22" y="112" fill="#35545d" font-size="24" font-family="Segoe UI, Arial, sans-serif">
        Disk checks, LVM, XFS, SSH, UFW
      </text>

      <path d="M184 132 L184 172" stroke="#2a9d8f" stroke-width="6" stroke-linecap="round"/>
      <path d="M166 158 L184 180 L202 158" fill="none" stroke="#2a9d8f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="0" y="198" width="372" height="96" rx="20" fill="#fff3e8"/>
      <text x="22" y="241" fill="#10323d" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700">
        Phase 2  Lockdown
      </text>
      <text x="22" y="280" fill="#35545d" font-size="24" font-family="Segoe UI, Arial, sans-serif">
        Reduce sudo only after successful attach
      </text>
    </g>
  </g>
</svg>
