<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">hard-repo</title>
  <desc id="desc">Production-oriented Veeam hardened repository bootstrap for Ubuntu.</desc>

  <rect width="1280" height="640" fill="#10181d"/>
  <rect x="0" y="0" width="18" height="640" fill="#18a999"/>
  <rect x="18" y="0" width="6" height="640" fill="#f2b84b"/>

  <g transform="translate(82 76)" font-family="Segoe UI, Arial, sans-serif">
    <text x="0" y="44" fill="#18a999" font-size="26" font-weight="700" letter-spacing="0">VEEAM HARDENED REPOSITORY</text>
    <text x="0" y="142" fill="#ffffff" font-size="88" font-weight="800" letter-spacing="0">hard-repo</text>
    <rect x="0" y="174" width="610" height="5" fill="#f2b84b"/>
    <text x="0" y="238" fill="#d9e4e8" font-size="31" letter-spacing="0">Safer bootstrap and controlled lockdown</text>
    <text x="0" y="282" fill="#96aab3" font-size="25" letter-spacing="0">Ubuntu 22.04 LTS / 24.04 LTS</text>

    <g transform="translate(0 350)">
      <rect x="0" y="0" width="190" height="74" rx="6" fill="#18262d" stroke="#38505b"/>
      <text x="22" y="31" fill="#18a999" font-size="18" font-weight="700" letter-spacing="0">01 PRECHECK</text>
      <text x="22" y="57" fill="#d9e4e8" font-size="19" letter-spacing="0">Fail closed</text>

      <rect x="210" y="0" width="190" height="74" rx="6" fill="#18262d" stroke="#38505b"/>
      <text x="232" y="31" fill="#18a999" font-size="18" font-weight="700" letter-spacing="0">02 PREPARE</text>
      <text x="232" y="57" fill="#d9e4e8" font-size="19" letter-spacing="0">LVM + XFS</text>

      <rect x="420" y="0" width="230" height="74" rx="6" fill="#18262d" stroke="#38505b"/>
      <text x="442" y="31" fill="#f2b84b" font-size="18" font-weight="700" letter-spacing="0">03 LOCKDOWN</text>
      <text x="442" y="57" fill="#d9e4e8" font-size="19" letter-spacing="0">After first attach</text>
    </g>

    <text x="0" y="505" fill="#758b95" font-size="20" letter-spacing="0">Dry-run  /  explicit disk selection  /  additive audit rules  /  operator logs</text>
  </g>

  <g transform="translate(850 92)" font-family="Consolas, Cascadia Mono, monospace">
    <rect x="0" y="0" width="352" height="452" rx="8" fill="#0a1014" stroke="#38505b" stroke-width="2"/>
    <rect x="0" y="0" width="352" height="48" rx="8" fill="#18262d"/>
    <rect x="0" y="40" width="352" height="8" fill="#18262d"/>
    <circle cx="28" cy="24" r="6" fill="#ef6b5b"/>
    <circle cx="50" cy="24" r="6" fill="#f2b84b"/>
    <circle cx="72" cy="24" r="6" fill="#18a999"/>
    <text x="24" y="92" fill="#758b95" font-size="18" letter-spacing="0">$ sudo ./hard-repo</text>
    <text x="24" y="134" fill="#18a999" font-size="18" font-weight="700" letter-spacing="0">[PRECHECK]</text>
    <text x="24" y="166" fill="#d9e4e8" font-size="17" letter-spacing="0">disk: /dev/sdb</text>
    <text x="24" y="194" fill="#d9e4e8" font-size="17" letter-spacing="0">root disk: /dev/sda</text>
    <text x="24" y="222" fill="#d9e4e8" font-size="17" letter-spacing="0">target: /veeamrepo</text>
    <text x="24" y="270" fill="#18a999" font-size="18" font-weight="700" letter-spacing="0">[STORAGE]</text>
    <text x="24" y="302" fill="#d9e4e8" font-size="17" letter-spacing="0">LVM + XFS ready</text>
    <text x="24" y="350" fill="#f2b84b" font-size="18" font-weight="700" letter-spacing="0">[NEXT]</text>
    <text x="24" y="382" fill="#d9e4e8" font-size="17" letter-spacing="0">Attach from Veeam,</text>
    <text x="24" y="410" fill="#d9e4e8" font-size="17" letter-spacing="0">then apply lockdown.</text>
  </g>
</svg>
