name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Syntax check
        run: |
          bash -n veeam_hardened_repository_safe.sh
          bash -n tests/full_flow_in_docker.sh
          bash -n tests/security_regression_tests.sh
          bash -n tests/veeam_test_runner.sh

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: '.'
          severity: style

      - name: Help smoke test
        run: |
          bash veeam_hardened_repository_safe.sh --help
          bash veeam_hardened_repository_safe.sh --help-full

      - name: Security regression tests
        run: bash tests/security_regression_tests.sh

  integration:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lvm2 xfsprogs parted util-linux

      - name: Run integration tests
        run: sudo bash tests/veeam_test_runner.sh
